<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>纱雾 · 试聊准备</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#253145;font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif}main{max-width:840px;margin:32px auto;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 12px 45px #24334d0b}header{padding:24px 28px;border-bottom:1px solid #e9edf3}h1{font-size:22px;margin:0 0 4px}.muted{font-size:13px;color:#67758b}.badge{display:inline-block;background:#edf0ff;color:#5160a2;border-radius:16px;padding:2px 12px;margin-top:10px}#chat{height:360px;overflow:auto;padding:20px 28px}.message{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0;max-width:85%;padding:12px 16px;border-radius:16px;background:#f0f3f8}.user{margin-left:auto;background:#edf0ff}.empty{text-align:center;color:#8591a4;padding-top:110px}form{padding:0 28px 24px}textarea{resize:vertical;width:100%;min-height:82px;border:1px solid #d7ddeb;border-radius:12px;padding:12px;font:inherit}button{border:0;border-radius:10px;background:#5264a4;color:white;padding:10px 24px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}.row{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:10px}#status{min-height:26px;color:#59677e;font-size:13px}details{border-top:1px solid #e9edf3;padding:18px 28px;font-size:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;color:#59677e}@media(max-width:600px){main{margin:0;border-radius:0;min-height:100vh}header,form,details{padding-left:18px;padding-right:18px}.row{align-items:flex-start}#chat{height:42vh;padding:15px}.message{max-width:95%}}
</style>
<main><header><h1>和泉纱雾</h1><div class="muted">小说第一卷开篇附近 · 初次相识</div><span class="badge" id="mode-badge">正在连接</span><div class="muted" id="mode-note">正在读取本次会话模式。</div></header>
<div id="chat" aria-live="polite"><div class="empty">发一条消息，检查试聊入口</div></div>
<form id="form"><textarea id="message" maxlength="1000" placeholder="输入消息…" aria-label="消息" required></textarea><div class="row"><label class="muted"><input type="checkbox" id="history" checked>下次发送使用本次最近两轮<br>关闭或撤回后，再开启也不带回旧对话。</label><button id="send">发送</button></div><div id="status" role="status"></div></form>
<details><summary>查看本次人物摘要与调用范围</summary><pre id="plan"></pre><p>不推进角色生活，不保存长期聊天；关闭服务后会话上下文丢弃。绘画能力、初识距离和未知近况仍需真实试聊检查。</p></details>
<details id="basis-inspector"><summary id="basis-title">本地材料预览 · 不发送给模型</summary>
<p id="basis-help">仅供查看选择过程，不是角色回复。启用后会在发送消息时自动预览有限明确问法的材料；也可用下面的话题检查。当前固定为开篇、初识；不会因声称熟悉而放开分享。</p>
<label>话题 <select id="basis-topic"><option value="greeting">初次问候</option><option value="drawing-origins">怎么开始画画</option><option value="drawing-experience">绘画经验</option><option value="art-feedback">作品反馈</option><option value="family">家庭近况</option><option value="composition">构图观点</option></select></label>
<button type="button" id="preview-basis">查看材料</button><pre id="basis-result" aria-live="polite">需以 --basis-preview 启动本地入口。</pre>
</details></main>
<script>
const token='__TOKEN__';const autoBasis='__BASIS_AUTO__'==='enabled';let state,pending,basisSequence=0;
const el=id=>document.getElementById(id);
function add(text,who){el('chat').querySelector('.empty')?.remove();const div=document.createElement('div');div.className='message '+who;div.textContent=text;el('chat').append(div);el('chat').scrollTop=el('chat').scrollHeight;}
function updateState(value){state=value;const grounded=state.material_mode==='bounded';const remote=state.mode==='remote';el('mode-badge').textContent=remote?'真实试聊'+(grounded?' · 按需人物材料':''):'离线联调 · 固定回声';el('mode-note').textContent=remote?'仅本次会话上下文，关闭后不保留；尚无生活推进。':'真实人物回复尚未启用。当前检查整条聊天链路，不读取密钥。';if(grounded){el('basis-title').textContent='查看人物材料依据';el('basis-help').textContent='回复只可使用通过核验的简短摘要。这里可单独检查当前材料；不会显示为角色说过的话。来源如有变化，以发送当时的检查为准。';}el('history').checked=state.history_enabled;el('status').textContent=`本次已尝试 ${state.attempts}/20 · 还可发送 ${Math.max(0,20-state.attempts)} 条 · ${state.history_enabled?'上下文已开启':'上下文已关闭'}`;if(!pending)el('send').disabled=state.attempts>=20;}
async function refresh(){const response=await fetch('/status');if(!response.ok)throw Error();updateState(await response.json());}
el('form').onsubmit=async event=>{event.preventDefault();if(!state)return;el('send').disabled=true;el('history').disabled=true;el('message').disabled=true;
if(!pending){pending={lab_id:state.lab_id,revision:state.revision,idempotency_key:crypto.randomUUID(),message:el('message').value,use_history:el('history').checked};add(pending.message,'user');}
try{const response=await fetch('/send',{method:'POST',headers:{'Content-Type':'application/json','X-Lab-Token':token},body:JSON.stringify(pending)});if(!response.ok)throw Error();const result=await response.json();const failures={'basis-or-source-missing':'人物材料缺失，这次没有生成回复。','basis-integrity-failed':'人物材料发生变化，需要重新核对。','credential-unavailable':'本次无法使用已配置的模型凭据。','attempt-budget-exhausted':'本次试聊额度已用完。','reply-unavailable':'这次未取得可用回复。'};add(result.status==='replied'?result.reply_text:(failures[result.code]||'这次未完成回复：'+result.code),'assistant');updateState(result);if(result.status==='replied'&&autoBasis&&state.material_mode!=='bounded'){el('basis-inspector').open=true;void showBasis({message:pending.message});}pending=null;if(result.status==='replied')el('message').value='';el('send').textContent='发送';}
catch{el('status').textContent='连接未确认。可用同一请求重取结果，不会再次调用模型。';el('send').textContent='重取结果';}
finally{el('send').disabled=!pending&&state?.attempts>=20;el('history').disabled=!!pending;el('message').disabled=!!pending;}};
async function showBasis(payload){const label=payload.message!==undefined?'对应消息：'+payload.message:'对应手动话题：'+payload.topic;const sequence=++basisSequence;el('preview-basis').disabled=true;el('basis-topic').disabled=true;el('basis-result').textContent='正在检查本地材料…';
try{const response=await fetch('/basis-preview',{method:'POST',headers:{'Content-Type':'application/json','X-Lab-Token':token},body:JSON.stringify(payload)});if(!response.ok)throw Error();const x=await response.json();if(sequence!==basisSequence)return;
const reasons={'time-not-established':'时间条件尚未落实','interpretation-only':'仅为场景归纳','private-background':'不适合初识默认分享','not-established':'尚无直接人物依据','wrong-subject':'属于其他角色','not-needed-for-topic':'本次话题不需要'};
if(x.code==='message-not-matched'){el('basis-result').textContent='这条消息未匹配到支持的明确问法，未读取或选择人物材料；不是判定角色没有相关经历。';}
else if(x.status==='ready'||x.status==='no-op'){el('basis-result').textContent=(x.selected.length?x.selected.map(v=>v.title+'：'+v.text+'\n出处：'+v.citations.join('；')).join('\n\n'):'本话题未选择人物往事；这不妨碍表达当下观点。')+'\n\n未选中：\n'+x.excluded.map(v=>v.title+'：'+(reasons[v.reason]||v.reason)).join('\n');}
else {const errors={'basis-preview-unavailable':'此入口未启用材料预览。','basis-or-source-missing':'材料包或小说文件缺失。','basis-integrity-failed':'材料或出处已变化，需重新核对。','unknown-topic':'请选择支持的话题。'};el('basis-result').textContent=errors[x.code]||'这次未能取得可用材料。';}el('basis-result').textContent=label+'\n\n'+el('basis-result').textContent;}
catch{if(sequence===basisSequence)el('basis-result').textContent='未取得预览结果，请检查本地服务。';}
finally{if(sequence===basisSequence){el('preview-basis').disabled=false;el('basis-topic').disabled=false;}}}
el('preview-basis').onclick=()=>showBasis({topic:el('basis-topic').value});
Promise.all([refresh(),fetch('/plan').then(r=>r.json()).then(x=>{const c=x.plan.character_context;el('plan').textContent='已核对背景：\n'+c.known_background.join('\n')+'\n\n本次交流设定：\n'+c.interaction_setup+'\n\n表达建议（待验证）：\n'+c.expression_guidance+'\n\n尚无依据的内容：\n'+c.unknown_context+'\n\n已提供的生活事件：无。用户说法与模型旧回复只供接话，不补入这里。'+'\n\n每次发送最多一次调用；当前消息≤1000字符，最近两轮合计≤4000字符，进程最多20次尝试。\n\n计划摘要：'+x.digest;})]).catch(()=>{el('status').textContent='服务未就绪，请重新打开页面。';});
</script></html>

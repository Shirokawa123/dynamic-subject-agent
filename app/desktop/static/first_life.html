<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生活试验</title>
<style>
:root{color-scheme:light;--ink:#303749;--muted:#707a88;--line:#e2e5ed;--accent:#58698c}*{box-sizing:border-box}body{margin:0;background:#f4f5f8;color:var(--ink);font:14px/1.7 system-ui,"Microsoft YaHei",sans-serif}.shell{max-width:1180px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px}h1{font-size:21px;margin:0}h2{font-size:15px;margin:0 0 12px}.quiet{color:var(--muted);font-size:12px}p{margin:0}.tag{padding:4px 10px;background:#e8ecf3;border-radius:20px;color:var(--accent);font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;margin-top:22px}.chat{min-height:calc(100dvh - 160px);display:flex;flex-direction:column}.messages{flex:1;min-height:260px}.empty{padding:9vh 18px;text-align:center;color:var(--muted)}.turn{margin:0 0 24px}.message{white-space:pre-wrap;overflow-wrap:anywhere;width:fit-content;max-width:90%;padding:12px 16px;border-radius:16px;background:white;border:1px solid #e9ebf2}.user{margin:0 0 14px auto;background:#e5eaf2;border:0;border-bottom-right-radius:4px}.assistant{border-bottom-left-radius:4px}.speaker{font-size:11px;color:var(--muted);margin:0 0 5px 4px}.proactive{border-left:3px solid #a2b3b4}.compose{position:sticky;bottom:0;background:#f4f5f8;padding-top:12px}form{display:flex;gap:10px;align-items:flex-end;padding:11px;background:white;border:1px solid var(--line);border-radius:15px}textarea{flex:1;resize:vertical;min-height:48px;max-height:180px;font:inherit;border:0;outline:none;background:transparent}button{font:inherit;font-size:13px;padding:8px 14px;border:0;border-radius:9px;background:var(--accent);color:white;cursor:pointer}button.secondary{background:#e9edf4;color:var(--ink)}button:disabled{opacity:.45;cursor:default}.panel{border:1px solid var(--line);border-radius:15px;padding:18px;background:#fff;margin-bottom:16px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.setting{display:block;margin:8px 0;font-size:12px;cursor:pointer}.setting input{vertical-align:middle}.draft-field{margin-top:12px}.draft-field b{display:block;font-size:11px;color:var(--muted);font-weight:500}.draft-field p{white-space:pre-wrap;overflow-wrap:anywhere}.version{padding:12px 0;border-bottom:1px solid var(--line)}.version:last-child{border:0}.event{padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.event:last-child{border:0}summary{cursor:pointer;color:var(--accent);font-size:12px}#feedback{min-height:29px;padding:7px 3px;font-size:12px;color:var(--muted)}#feedback.error{color:#984b40}#life-note{min-height:35px}.footer{font-size:11px;color:var(--muted);padding:0 3px 12px}@media(max-width:800px){.shell{padding:16px}.layout{grid-template-columns:1fr}.chat{min-height:60dvh}aside{order:-1}.panel{margin-bottom:10px}.layout{gap:12px}.messages{min-height:220px}}
</style>
<main class="shell"><header><div><h1 id="name">人物生活试验</h1><p class="quiet">独立试验对话 · 不继承原聊天记录</p></div><span class="tag">文字方案，不生成图片</span></header><div class="layout">
<section class="chat"><div id="messages" class="messages" aria-label="聊天与主动消息"><div class="empty">正在读取记录…</div></div><div class="compose"><form id="composer"><textarea id="draft" rows="2" maxlength="1000" placeholder="聊聊她在意的事，也可以问问这次的方案…" aria-label="消息" disabled></textarea><button id="send" disabled>发送</button></form><div id="feedback" role="status" aria-live="polite"></div><div class="footer">聊天保存在本机 · 最近20轮与应用内近况 · AI生成内容</div></div></section>
<aside><section class="panel"><h2>生活节奏</h2><p id="life-note" class="quiet">正在读取状态…</p><div class="controls"><button id="pause" disabled>开始生活</button><button id="step" class="secondary" disabled>模拟推进一次</button></div><label class="setting"><input id="sharing" type="checkbox" disabled> 允许应用内主动分享</label><label class="setting"><input id="history" type="checkbox" disabled> 聊天参考近期交流</label><div class="controls"><button id="context-reset" class="secondary" aria-expanded="false" aria-controls="context-reset-explanation" disabled>从新消息继续…</button></div><div id="context-reset-explanation" hidden><p id="context-reset-copy" class="quiet"></p><div class="controls"><button id="context-reset-confirm" disabled>确认，从新消息继续</button><button id="context-reset-cancel" class="secondary">取消</button></div></div><p id="context-note" class="quiet"></p><p class="quiet">保持窗口开启才积累时间，关闭后不补算。暂停只停止新活动，主动分享可单独关闭；模拟推进会明确标注。</p><p id="budget" class="quiet" style="margin-top:10px"></p></section>
<section class="panel"><h2>当前文字方案</h2><div id="project"><p class="quiet">还没有已提交的方案。</p></div><details style="margin-top:14px"><summary>查看已有版本</summary><div id="versions"></div></details></section>
<section class="panel"><h2>这次发生的变化</h2><div id="events"><p class="quiet">生活事件还未开始。</p></div></section></aside></div></main>
<script>
const TOKEN='__SESSION_TOKEN__',SESSION=crypto.randomUUID(),el=id=>document.getElementById(id);
let busy=false,pendingWork=0,ready=false,current=null,lastMessages='',heartbeatBusy=false,contextResetOpen=false;
const phaseNames={unstarted:'尚未开始',drafted:'已有初稿',revised:'已调整方案',kept:'已保留方案，当前试验暂无下一项活动',deferred:'项目暂缓，当前试验不自动恢复',rework:'准备尝试替代方案'};
function feedback(text,error=false){el('feedback').textContent=text;el('feedback').className=error?'error':'';}
function lock(value){busy=value;const c=current&&current.character;const chatReady=ready&&c.budget_remaining>=2&&(!c.development_run||c.development_calls_remaining>=2);for(const id of ['send','draft'])el(id).disabled=value||contextResetOpen||!chatReady;for(const id of ['pause','sharing','history'])el(id).disabled=!ready;el('step').disabled=value||!ready||!c||c.paused||c.status==='needs-attention'||c.budget_remaining<1||c.today_decisions_used>=6||['kept','deferred'].includes(c.phase);const resetBlocked=value||!ready||!!(current&&current.presentation_pending)||!(current&&current.context_reset_confirmation);el('context-reset').disabled=resetBlocked||contextResetOpen;el('context-reset-confirm').disabled=resetBlocked||!contextResetOpen;el('context-reset-cancel').disabled=value;el('send').textContent=value?'处理中…':'发送';}
function showContextReset(value){contextResetOpen=value;el('context-reset-explanation').hidden=!value;el('context-reset').setAttribute('aria-expanded',String(value));lock(busy);}
function begin(){pendingWork++;lock(true);}
function end(){pendingWork=Math.max(0,pendingWork-1);lock(pendingWork>0);resumeVisiblePending();}
async function request(path,payload){const options=payload===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Chat-Token':TOKEN},body:JSON.stringify(payload)};const r=await fetch(path,{...options,cache:'no-store'});if(!r.ok)throw new Error('request');return r.json();}
function textElement(tag,text,className){const node=document.createElement(tag);node.textContent=text;if(className)node.className=className;return node;}
function draftFields(container,version){for(const [field,label] of [['subject','主题'],['composition','构图'],['focus','关注点']]){const row=document.createElement('div');row.className='draft-field';row.append(textElement('b',label),textElement('p',version[field]||''));container.append(row);}}
function render(state){current=state;const c=state.character;el('name').textContent=(c.subject_name||'人物')+' · 生活试验';document.title=el('name').textContent;ready=['active','paused','needs-attention'].includes(c.status)&&state.history.status==='available'&&state.life_status==='available';
el('pause').textContent=c.status==='needs-attention'?'显式恢复生活':(c.paused?'开始生活':'暂停生活');el('sharing').checked=c.sharing_enabled;el('history').checked=c.history_enabled;
el('context-reset-copy').textContent=state.context_reset_confirmation||'';el('context-note').textContent=c.context_start_sequence>0?'已设置新交流起点。此前记录仍可查看，但不再进入后续聊天上下文。':'';
el('life-note').textContent=(c.status==='needs-attention'?'系统处理遇到问题，自动推进已停止；可显式恢复。':(c.paused?'生活已暂停。':'生活开启，按在线时间有限推进。'))+' '+(phaseNames[c.phase]||'当前创作项目')+(c.unanswered_share?' · 已留下一条近况，等待你回应。':'');
el('budget').textContent=`总调用 ${c.budget_used} / ${c.budget_total}；今日生活决策 ${c.today_decisions_used} / 6，分享调用 ${c.today_share_calls_used} / 2。`+(c.development_run?` 自动验收剩余 ${c.development_calls_remaining} 次。`:'');
const serialized=JSON.stringify(state.messages);if(serialized!==lastMessages){lastMessages=serialized;el('messages').replaceChildren();if(!state.messages.length)el('messages').append(textElement('div','从一句招呼开始。生活试验会留下真实提交的方案变化。','empty'));for(const item of state.messages){const group=document.createElement('div');group.className='turn';if(item.kind==='dialogue')group.append(textElement('div',item.user_text,'message user'));group.append(textElement('div',c.subject_name+(item.kind==='share'?' · 主动分享':''),'speaker'),textElement('div',item.assistant_text,'message assistant'+(item.kind==='share'?' proactive':'')));el('messages').append(group);}}
el('project').replaceChildren();if(state.project){el('project').append(textElement('p','方案 '+state.project.revision,'quiet'));draftFields(el('project'),state.project);}else el('project').append(textElement('p','还没有已提交的文字方案。','quiet'));
el('versions').replaceChildren();for(const version of state.versions){const box=document.createElement('div');box.className='version';box.append(textElement('p','方案 '+version.revision+(version.reason?' · '+version.reason:''),'quiet'));draftFields(box,version);el('versions').append(box);}
el('events').replaceChildren();for(const event of state.events)el('events').append(textElement('p',(event.simulated?'[模拟推进] ':'')+event.summary,'event'));if(!state.events.length)el('events').append(textElement('p','还没有已提交的生活变化。','quiet'));
if(state.presentation_pending)el('life-note').textContent+=' 正在处理请求，暂时显示最近已确认的记录。';if(!ready)feedback('当前状态无法安全读取，已暂停操作。',true);lock(busy);resumeVisiblePending();}
function resumeVisiblePending(){if(busy||!ready||!current||!current.pending_handle)return;begin();feedback('正在继续读取上一次请求的结果…');settled({pending:current.pending_handle}).then(done=>feedback(done.ok?'':(done.message||'上次请求未完成。'),!done.ok)).catch(()=>{ready=false;feedback('上次请求结果未能确认，请稍后刷新查看记录。',true);}).finally(end);}
async function settled(result){const deadline=Date.now()+120000;while(result.pending){if(Date.now()>deadline)throw new Error('pending-timeout');await new Promise(resolve=>setTimeout(resolve,900));result=await request('/operation',{handle:result.pending});if(result.state)render(result.state);}return result;}
async function action(path,payload,successText){begin();try{const result=await settled(await request(path,{...payload,request_id:crypto.randomUUID()}));if(result.state)render(result.state);feedback(result.ok?successText:(result.message||'这次操作未完成。'),!result.ok);return result;}catch{ready=false;feedback('连接未能确认，请刷新后检查记录。草稿保留。',true);}finally{end();}}
el('composer').addEventListener('submit',async event=>{event.preventDefault();if(busy||!ready||contextResetOpen)return;const text=el('draft').value.trim();if(!text)return;feedback('正在回复…');const result=await action('/send',{text},'');if(result&&result.ok)el('draft').value='';});
el('draft').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();el('composer').requestSubmit();}});
el('pause').addEventListener('click',()=>{if(current)action('/controls',{paused:current.character.status==='needs-attention'?false:!current.character.paused},'生活控制请求已处理，请以当前状态为准。');});
el('step').addEventListener('click',()=>{if(!busy)action('/simulate',{},'已处理一次明确标注的模拟推进。');});
el('sharing').addEventListener('change',()=>action('/controls',{sharing_enabled:el('sharing').checked},el('sharing').checked?'已允许主动分享。':'主动分享已关闭，生活可继续。'));
el('history').addEventListener('change',async()=>{begin();feedback('正在保存聊天上下文设置…');try{const result=await request('/history',{enabled:el('history').checked});render(result.state);feedback(result.ok?'聊天上下文设置已保存，本地记录保留。':'设置未保存。',!result.ok);}catch{ready=false;feedback('设置未能确认，请刷新检查。',true);}finally{end();}});
el('context-reset').addEventListener('click',()=>{if(!el('context-reset').disabled&&!heartbeatBusy)showContextReset(true);});
el('context-reset-cancel').addEventListener('click',()=>{if(!busy)showContextReset(false);});
el('context-reset-confirm').addEventListener('click',async()=>{if(el('context-reset-confirm').disabled||!contextResetOpen||heartbeatBusy)return;feedback('正在确认新的聊天上下文范围…');const result=await action('/context-reset',{confirmed:true},'已从新消息继续。旧记录保留，人物资料与当前活动仍可使用；草稿未发送。');if(result&&result.ok)showContextReset(false);});
async function heartbeat(){if(heartbeatBusy||contextResetOpen||!ready||document.hidden||!current||current.character.status==='needs-attention'||(current.character.paused&&!current.character.sharing_enabled))return;heartbeatBusy=true;try{const result=await request('/heartbeat',{session_id:SESSION,request_id:crypto.randomUUID()});if(result.pending&&!busy){begin();if(result.state)render(result.state);feedback('正在处理一次生活变化…');settled(result).then(done=>feedback(done.ok?'生活状态已更新。':(done.message||'本次推进未完成。'),!done.ok)).catch(()=>{ready=false;feedback('推进结果未能确认，请刷新查看记录。',true);}).finally(end);}else{if(result.state)render(result.state);}if(!result.ok&&!busy)feedback(result.message||'生活推进未完成；没有据此生成故事结果。',true);}catch{ready=false;feedback('生活连接中断，停止推进；请刷新检查。',true);}finally{heartbeatBusy=false;}}
setInterval(heartbeat,5000);request('/status').then(render).catch(()=>feedback('无法读取本地生活试验状态。',true));
</script></html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Avery</title>
<style>
  body { margin:0; background:#f3efe6; color:#26221c; font-family:"Noto Serif SC","Songti SC",Georgia,serif; }
  .app { display:flex; max-width:860px; margin:0 auto; min-height:100vh; }
  .chat { flex:1; padding:24px 26px 130px; }
  .rail { width:230px; border-left:1px solid #d5cdbb; padding:24px 18px; font-size:12px; color:#7d7462; }
  .rail h2 { font-size:13px; font-weight:normal; letter-spacing:2px; margin:0 0 10px; color:#5f5645; }
  .card { background:#faf7ef; border:1px solid #ddd3bf; border-radius:4px; padding:8px 10px; margin-bottom:8px; font-family:ui-monospace,Consolas,monospace; font-size:11px; line-height:1.7; }
  .card .k { color:#9a7b3f; }
  header { margin-bottom:22px; }
  h1 { font-size:20px; font-weight:normal; letter-spacing:2px; margin:0; }
  .turn { margin-bottom:24px; }
  .user { color:#6b6152; margin-bottom:6px; text-align:right; }
  .user::before { content:"▸ "; color:#b0a488; }
  .say { font-size:16px; line-height:2; white-space:pre-wrap; }
  .notes { margin-top:8px; border-left:2px solid #d5cdbb; padding-left:12px; font-size:12px; color:#8d8371; line-height:1.9; }
  .notes .tag { display:inline-block; border:1px solid #c9bda4; border-radius:3px; padding:0 6px; margin-right:6px; font-size:11px; color:#7a6d55; background:#eee8d8; }
  .notes .cite { color:#9a7b3f; border-bottom:1px dotted #c9b98f; }
  .failed { color:#a04b3a; font-size:13px; margin-top:8px; }
  .inputbar { position:fixed; bottom:0; left:230px; right:0; background:#f3efe6; border-top:1px solid #d5cdbb; }
  .inputbar .inner { max-width:600px; margin:0 auto; padding:14px 26px; display:flex; gap:10px; }
  input[type=text] { flex:1; border:1px solid #cfc5ae; background:#fbf8f0; border-radius:4px; padding:10px 14px; font:inherit; color:inherit; }
  button { border:1px solid #5f5645; background:none; color:#5f5645; border-radius:4px; padding:10px 20px; font:inherit; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:default; }
  header { display:flex; justify-content:space-between; align-items:center; }
  .quiet-button { padding:5px 10px; border-color:#c9bda4; font-size:12px; }
  .setup-screen { position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; background:rgba(243,239,230,.96); }
  .setup-screen[hidden] { display:none; }
  .setup-card { width:min(470px,calc(100vw - 48px)); padding:30px; border:1px solid #cfc5ae; border-radius:6px; background:#faf7ef; box-shadow:0 18px 60px rgba(62,51,32,.12); }
  .setup-card h2 { margin:0 0 14px; font-size:20px; font-weight:normal; letter-spacing:2px; }
  .setup-card p { color:#756b5a; line-height:1.8; font-size:13px; }
  .setup-card input { box-sizing:border-box; width:100%; margin:8px 0 14px; }
  .setup-actions { display:flex; flex-wrap:wrap; gap:8px; }
  .setup-status { min-height:22px; margin-top:12px; font-size:13px; color:#7a6d55; }
  .setup-status.error { color:#a04b3a; }
</style>
</head>
<body>
<div class="setup-screen" id="setup-screen" hidden>
  <div class="setup-card">
    <h2>连 接 DeepSeek</h2>
    <p>API key 只保存到 Windows Credential Manager，并仅用于 HTTPS Bearer 鉴权。它不会进入聊天、记忆、Timeline、SQLite 或日志。</p>
    <input type="password" id="api-key" placeholder="粘贴 DeepSeek API key" autocomplete="new-password" spellcheck="false">
    <div class="setup-actions">
      <button id="save-key">保存并验证</button>
      <button id="delete-key" class="quiet-button">删除已保存凭据</button>
      <button id="close-setup" class="quiet-button">返回聊天</button>
    </div>
    <div class="setup-status" id="setup-status"></div>
  </div>
</div>
<div class="app">
  <div class="chat">
    <header><h1>Avery</h1><button id="open-setup" class="quiet-button">连接设置</button></header>
    <div id="log"></div>
  </div>
  <div class="rail">
    <h2>记 忆</h2>
    <div id="rail-memories"></div>
    <h2 style="margin-top:18px">知 识 来 源</h2>
    <div class="card"><span class="k">4 entries</span> · project-original</div>
    <h2 style="margin-top:18px">立 场</h2>
    <div class="card" id="rail-stance"><span class="k">尚无立场互动</span></div>
    <h2 style="margin-top:18px">目 标 与 承 诺</h2>
    <div id="rail-goals"><div class="card"><span class="k">尚无明确记录</span></div></div>
    <h2 style="margin-top:18px">当 前 姿 态</h2>
    <div id="rail-situated"><div class="card"><span class="k">neutral</span></div></div>
    <h2 style="margin-top:18px">中 期 基 线</h2>
    <div id="rail-medium"><div class="card"><span class="k">settled · v0</span></div></div>
  </div>
</div>
<div class="inputbar"><div class="inner">
  <input type="text" id="text" placeholder="说点什么……" autocomplete="off">
  <button id="send">寄出</button>
</div></div>
<script>
const log = document.getElementById("log");
const sendBtn = document.getElementById("send");
const textBox = document.getElementById("text");
const knownMemories = new Map();
let stanceAccepted = 0;
let productReady = false;
const setupScreen = document.getElementById("setup-screen");
const setupStatus = document.getElementById("setup-status");
const keyInput = document.getElementById("api-key");
const saveKeyButton = document.getElementById("save-key");
const deleteKeyButton = document.getElementById("delete-key");
const closeSetupButton = document.getElementById("close-setup");

const setupProblemLabels = {
  "credential-invalid": "验证失败：API key 无效。",
  "credential-verification-unavailable": "暂时无法连接 DeepSeek，请检查网络后重试。",
  "secure-backend-unavailable": "Windows Credential Manager 当前不可用，未保存明文替代。",
  "credential-read-failed": "无法读取 Windows Credential Manager。",
  "credential-write-failed": "无法写入 Windows Credential Manager。",
  "credential-delete-failed": "无法删除 Windows Credential Manager 中的凭据。",
  "product-open-failed": "凭据已处理，但本地主体运行时启动失败。",
};

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

async function refreshState() {
  const res = await fetch("/api/state");
  const state = await res.json();
  if (!res.ok || !state.ok) {
    productReady = false;
    await refreshSetup();
    return;
  }
  stanceAccepted = state.relationship_accepted_count || 0;
  const rail = document.getElementById("rail-memories");
  rail.innerHTML = "";
  for (const m of state.memories) {
    if (!knownMemories.has(m.memory_id)) {
      knownMemories.set(m.memory_id, m);
      if (log.children.length > 0) return renderRail(state); // 首载不标新
    }
  }
  renderRail(state);
}

function showSetup(snapshot, message="") {
  productReady = Boolean(snapshot && snapshot.product_ready);
  setupScreen.hidden = false;
  closeSetupButton.hidden = !productReady;
  deleteKeyButton.hidden = !(snapshot && snapshot.configured);
  setupStatus.className = "setup-status" + (snapshot && snapshot.problem ? " error" : "");
  setupStatus.textContent = message || (
    snapshot && snapshot.problem
      ? (setupProblemLabels[snapshot.problem] || "凭据操作失败。")
      : (snapshot && snapshot.configured ? "凭据已安全保存。" : "尚未配置凭据。")
  );
}

async function refreshSetup() {
  try {
    const res = await fetch("/api/setup");
    const snapshot = await res.json();
    productReady = Boolean(snapshot.product_ready);
    if (productReady) {
      setupScreen.hidden = true;
    } else {
      showSetup(snapshot);
    }
    return snapshot;
  } catch (error) {
    showSetup({configured:false, product_ready:false, problem:null}, "本地设置服务不可用。 ");
    return null;
  }
}

async function saveCredential() {
  let apiKey = keyInput.value.trim();
  if (!apiKey || saveKeyButton.disabled) return;
  saveKeyButton.disabled = true;
  setupStatus.className = "setup-status";
  setupStatus.textContent = "正在安全保存并验证……";
  try {
    const res = await fetch("/api/credential", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({api_key: apiKey}),
    });
    const result = await res.json();
    keyInput.value = "";
    if (result.ok) {
      productReady = true;
      setupScreen.hidden = true;
      await refreshState();
    } else {
      showSetup(result);
    }
  } catch (error) {
    keyInput.value = "";
    showSetup({configured:false, product_ready:false, problem:null}, "连接本地设置服务失败。 ");
  } finally {
    apiKey = "";
    saveKeyButton.disabled = false;
  }
}

async function deleteCredential() {
  deleteKeyButton.disabled = true;
  try {
    const res = await fetch("/api/credential", {method:"DELETE"});
    const result = await res.json();
    keyInput.value = "";
    showSetup(result, result.ok ? "凭据已从 Windows Credential Manager 删除；对话数据未删除。" : "删除失败。 ");
  } finally {
    deleteKeyButton.disabled = false;
  }
}

function renderRail(state) {
  const rail = document.getElementById("rail-memories");
  rail.innerHTML = "";
  for (const m of state.memories) {
    const card = el("div", "card");
    const kindTag = el("span", "k", m.status === "superseded"
      ? "【已更正】"
      : (m.memory_kind === "plan" ? "【打算】" : "【长期】"));
    card.appendChild(kindTag);
    card.appendChild(el("span", "k", m.memory_id.slice(0, 8)));
    card.appendChild(document.createElement("br"));
    card.appendChild(document.createTextNode("「" + m.content + "」"));
    rail.appendChild(card);
  }
  const stance = document.getElementById("rail-stance");
  stance.innerHTML = stanceAccepted > 0
    ? `<span class="k">${stanceAccepted} accepted</span> · ${state.relationship_latest_event || "互动"}`
    : '<span class="k">尚无立场互动</span>';
  const goals = document.getElementById("rail-goals");
  goals.innerHTML = "";
  const statusLabels = {
    active: "进行中", achieved: "已达成", abandoned: "已放弃",
    fulfilled: "已履行", released: "已解除", superseded: "已修订",
  };
  for (const record of state.participant_goals || []) {
    const card = el("div", "card");
    card.appendChild(el("span", "k",
      record.kind === "goal" ? "【目标】" : "【承诺】"));
    card.appendChild(document.createTextNode(
      " " + (statusLabels[record.status] || record.status)));
    card.appendChild(document.createElement("br"));
    card.appendChild(document.createTextNode("「" + record.terms + "」"));
    goals.appendChild(card);
  }
  if (!goals.children.length) {
    goals.appendChild(el("div", "card", "尚无明确记录"));
  }
  const situated = document.getElementById("rail-situated");
  situated.innerHTML = "";
  if (state.situated_state) {
    const s = state.situated_state;
    const card = el("div", "card");
    card.appendChild(el("span", "k", `【${s.posture}】`));
    card.appendChild(document.createElement("br"));
    card.appendChild(document.createTextNode(
      `剩余 ${s.remaining_turns} 轮 · ${s.expires_in_seconds} 秒`));
    situated.appendChild(card);
  } else {
    situated.appendChild(el("div", "card", "neutral"));
  }
  const medium = document.getElementById("rail-medium");
  const mediumState = state.medium_state || {baseline:"settled", version:0};
  medium.innerHTML = "";
  medium.appendChild(el("div", "card",
    `${mediumState.baseline} · v${mediumState.version}`));
}

async function send() {
  const text = textBox.value.trim();
  if (!text || sendBtn.disabled) return;
  textBox.value = "";
  sendBtn.disabled = true;
  const userTurn = el("div", "turn user");
  userTurn.textContent = text;
  log.appendChild(userTurn);
  const aiTurn = el("div", "turn ai");
  const say = el("div", "say", "……");
  aiTurn.appendChild(say);
  log.appendChild(aiTurn);
  try {
    const res = await fetch("/api/turn", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text}),
    });
    const turn = await res.json();
    if (!turn.ok) {
      say.remove();
      aiTurn.appendChild(el("div", "failed",
        `本轮失败关闭: ${turn.stage || "unknown"}:${turn.code}`));
    } else {
      say.textContent = turn.expression;
      const notes = el("div", "notes");
      if (turn.citations.length) {
        for (const c of turn.citations) {
          const span = el("span");
          span.appendChild(el("span", "tag", "引用"));
          const link = el("span", "cite", c.title);
          span.appendChild(link);
          span.appendChild(document.createTextNode(" · " + c.source));
          notes.appendChild(span);
        }
      }
      if (turn.recalled_ids.length) {
        const span = el("span");
        span.appendChild(el("span", "tag", "召回"));
        span.appendChild(document.createTextNode(
          turn.recalled_ids.length + " 条记忆"));
        notes.appendChild(span);
      }
      if (turn.living_memory_status === "accepted") {
        const span = el("span");
        span.appendChild(el("span", "tag", "记忆更新"));
        notes.appendChild(span);
      }
      if (turn.living_memory_status === "failed-closed") {
        const span = el("span");
        span.appendChild(el("span", "tag", "记忆"));
        span.appendChild(document.createTextNode("failed-closed"));
        notes.appendChild(span);
      }
      if (turn.knowledge_status === "failed-closed") {
        const span = el("span");
        span.appendChild(el("span", "tag", "知识"));
        span.appendChild(document.createTextNode("failed-closed"));
        notes.appendChild(span);
      }
      if (turn.new_memory_kind) {
        const span = el("span");
        span.appendChild(document.createTextNode(
          turn.new_memory_kind === "plan" ? "【打算】" : "【长期】"));
        notes.appendChild(span);
      }
      if (turn.relationship_event) {
        const span = el("span");
        span.appendChild(el("span", "tag", "立场"));
        span.appendChild(document.createTextNode(turn.relationship_event));
        notes.appendChild(span);
        if (turn.relationship_event === "stable_positive_interaction") {
          stanceAccepted += 1;
        }
      }
      if (turn.relationship_status === "failed-closed") {
        const span = el("span");
        span.appendChild(el("span", "tag", "立场"));
        span.appendChild(document.createTextNode("failed-closed"));
        notes.appendChild(span);
      }
      if (turn.participant_goal_status) {
        const span = el("span");
        span.appendChild(el("span", "tag", "目标/承诺"));
        span.appendChild(document.createTextNode(
          `${turn.participant_goal_action || "noop"} · ${turn.participant_goal_status}`));
        notes.appendChild(span);
      }
      if (turn.situated_state_status) {
        const span = el("span");
        span.appendChild(el("span", "tag", "短时姿态"));
        span.appendChild(document.createTextNode(
          `${turn.situated_state_action || "noop"} · ${turn.situated_state_status}`
          + (turn.situated_state_posture ? ` · ${turn.situated_state_posture}` : "")));
        notes.appendChild(span);
      }
      if (turn.medium_state_status) {
        const span = el("span");
        span.appendChild(el("span", "tag", "中期基线"));
        span.appendChild(document.createTextNode(
          `${turn.medium_state_status}`
          + (turn.medium_state_baseline ? ` · ${turn.medium_state_baseline}` : "")));
        notes.appendChild(span);
      }
      if (notes.children.length) aiTurn.appendChild(notes);
      await refreshState();
      if (turn.living_memory_status === "accepted") {
        const latest = [...knownMemories.values()].at(-1);
        if (latest) {
          const hint = el("span");
          hint.appendChild(document.createTextNode(
            "「" + latest.content + "」"));
          notes.appendChild(hint);
        }
      }
    }
  } catch (error) {
    say.remove();
    aiTurn.appendChild(el("div", "failed", "连接失败: " + error));
  } finally {
    sendBtn.disabled = false;
    textBox.focus();
    window.scrollTo(0, document.body.scrollHeight);
  }
}

sendBtn.addEventListener("click", send);
textBox.addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});
saveKeyButton.addEventListener("click", saveCredential);
deleteKeyButton.addEventListener("click", deleteCredential);
document.getElementById("open-setup").addEventListener("click", async () => {
  const snapshot = await refreshSetup();
  if (snapshot) showSetup(snapshot);
});
closeSetupButton.addEventListener("click", () => {
  if (productReady) setupScreen.hidden = true;
});
keyInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") saveCredential();
});
(async () => {
  const snapshot = await refreshSetup();
  if (snapshot && snapshot.product_ready) await refreshState();
})();
textBox.focus();
</script>
</body>
</html>
